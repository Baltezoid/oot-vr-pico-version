apply plugin: 'com.android.application'

// The native libraries are built by CMake OUTSIDE gradle (see Android/README.md) and dropped
// into app/libs/arm64-v8a. Decoupling the two avoids gradle's exact-version pin on the NDK and
// on CMake - the reference port pins CMake 3.31.5, which nothing on this machine has - and keeps
// the build loop that already works for the native side untouched.
android {
    namespace 'org.oot.vr'
    compileSdkVersion 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "org.oot.vr"
        minSdkVersion 29          // Horizon OS is Android 10+
        targetSdkVersion 32       // what Meta's OpenXR samples target
        // CI sets these from the release tag (see .github/workflows/release.yml).
        versionCode((project.findProperty('appVersionCode') ?: '1') as int)
        versionName project.findProperty('appVersionName') ?: '0.1-quest'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // SOH [Quest] A fixed debug key, so that a debug APK from CI installs over a debug APK
        // from a different CI run or from a local build, and the save data stays. Each CI runner
        // makes a new ~/.android/debug.keystore otherwise. This key is public on purpose.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def releaseStoreFile = project.findProperty('storeFile')
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword project.findProperty('storePassword')
                keyAlias project.findProperty('keyAlias')
                keyPassword project.findProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main {
        jniLibs.srcDirs = ['libs']
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // Add Mods reads .7z files. xz decodes LZMA and LZMA2.
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.12'
    // The setup's decision logic lives in plain-Java classes so it can be tested on the host.
    testImplementation 'junit:junit:4.13.2'
    // Android has org.json. The host tests need the real one, not the android.jar stub.
    testImplementation 'org.json:json:20240303'
}
